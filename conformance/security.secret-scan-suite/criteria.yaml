suite: security.secret-scan-suite
contract: security.secret-scan
contract_version: "1.0.0"

criteria:
  - id: schema_conformance
    type: schema_conformance
    assertion:
      schema: findings/schemas/sarif-2.1.0.schema.json
      scope: every-fixture

  - id: exit_code
    type: exit_code
    assertion:
      expected_exit_code: 0
      scope: every-fixture

  - id: evidence_presence
    type: evidence_presence
    assertion:
      required:
        - sarif-report
        - exit-code
      scope: every-fixture
