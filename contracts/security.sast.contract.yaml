action: security.sast
contract_version: "1.0.0"

required_inputs:
  type: object
  required:
    - source_dir
  properties:
    source_dir:
      type: string
      description: Path to the source directory to scan.
    ruleset_ref:
      type: string
      description: Reference to the ruleset or policy bundle the scanner should apply.
    severity_threshold:
      type: string
      enum: [none, info, low, medium, high, critical]
      description: Findings at or above this severity fail the action when the spec criterion enforces it.

output_schema: findings/schemas/sarif-2.1.0.schema.json

required_evidence:
  - sarif-report
  - exit-code

conformance_suite: security.sast-suite
