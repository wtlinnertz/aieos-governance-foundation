name: kit-ci

# Reusable workflow: structural + markdown validation for an AIEOS kit repo.
# Kits call this via:
#   jobs:
#     kit-ci:
#       uses: wtlinnertz/aieos-governance-foundation/.github/workflows/kit-ci.yml@main
#
# In a reusable workflow, github.repository is the CALLER, so the default
# checkout pulls the kit; governance-foundation is checked out separately for
# check-structure.sh + the canonical governance-model.md + the lint configs.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  kit-ci:
    name: Kit validation
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2 — the caller kit repo
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: kit

      # actions/checkout v6.0.2 — governance-foundation (scripts + canonical + configs)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: wtlinnertz/aieos-governance-foundation
          ref: main
          path: gf

      # actions/checkout v6.0.2 — aieos-schema (canonical Document Control
      # schema + instance validator, FR-018)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: wtlinnertz/aieos-schema
          ref: main
          path: schema

      - name: Structural validation
        run: bash gf/tests/check-structure.sh "$GITHUB_WORKSPACE/kit"

      - name: Install Document Control validator dependency
        run: pip install pyyaml

      # G-2 (FR-018): every template's Document Control block must conform to
      # schema/document-control.yaml. The validator skips files without an
      # `| Artifact ID |` row, so on its own it would pass unmigrated templates
      # vacuously — exactly how G-2 stayed hidden. The completeness assertion
      # below closes that hole: every *-template.md NOT on the documented
      # exemption list (D4) must carry the row, so "skipped" fails loudly.
      - name: Document Control validation (FR-018 / G-2)
        run: python3 schema/scripts/validate-document-control.py kit/docs/artifacts/

      # FR-014 slice 3: deterministic judge-calibration staleness check.
      # Hash compare ONLY (prompt half) -- no LLM call on any CI path; the
      # model half is checked harness-side (--check-only) and by the
      # dark-factory conductor. Kits without a calibration.lock no-op:
      # calibration adoption is per-validator, per kit.
      - name: Calibration lock staleness (FR-014)
        run: python3 gf/scripts/check-calibration-lock.py kit

      - name: Document Control completeness assertion (D5)
        run: |
          # D4 documented exemptions — templates that are NOT manifest nodes
          # (intake/context inputs + adr, whose Status is the ADR lifecycle,
          # not freeze status). product-brief is an input (role: brief), never
          # a governed artifact. Everything else must carry the canonical block.
          exempt="adr-template.md
          architecture-context-template.md
          design-context-template.md
          incident-intake-template.md
          pivot-decision-template.md
          product-brief-template.md
          release-context-intake-template.md
          service-reliability-intake-template.md
          system-context-template.md"
          fail=0
          for f in kit/docs/artifacts/*-template.md; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if printf '%s\n' $exempt | grep -qx "$base"; then
              continue
            fi
            if ! grep -q '| Artifact ID |' "$f"; then
              echo "MISSING canonical Document Control ('| Artifact ID |' row): $base"
              fail=1
            fi
            # Ordering guard: every reader (validator, read_frozen_artifacts)
            # is first-match over the whole file, so the Document Control
            # table must be the FIRST place a | Status | <value> | row
            # appears. A Status-bearing table added above it would silently
            # shadow the freeze status for every reader.
            first_status=$(grep -m1 -E '\|[[:space:]]*Status[[:space:]]*\|[[:space:]]*[^|]+\|' "$f" || true)
            if [ -n "$first_status" ] && ! printf '%s' "$first_status" | grep -q 'DRAFT'; then
              echo "FIRST '| Status |' row is not the Document Control '| Status | DRAFT |' row: $base -> $first_status"
              fail=1
            fi
          done
          exit "$fail"

      - name: Install markdown tools
        run: npm install -g markdownlint-cli2 markdown-link-check

      - name: Markdown lint
        run: markdownlint-cli2 --config gf/tests/.markdownlint.yaml "kit/docs/**/*.md"

      - name: Markdown link check
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            markdown-link-check --quiet --config gf/tests/.markdown-link-check.json "$f" || fail=1
          done < <(find kit/docs -name '*.md' -print0)
          exit "$fail"
