suite: verify.smoke-suite
contract: verify.smoke
contract_version: "1.0.0"

# v1.1 input mapping. CI stands up an http.server serving /healthz and exports
# AIEOS_FIXTURE_SMOKE_URL (env resolver). check_configuration is a literal value.
inputs:
  target_url:
    env: AIEOS_FIXTURE_SMOKE_URL
  check_configuration:
    value:
      method: "GET"
      path: "/healthz"
      expected_status: 200

# verify.smoke's contract declares output_schema: null. Live execution
# requires a reachable target_url. The CI workflow that runs this suite
# spins up a tiny http.server on a known port and supplies target_url
# via the harness's adapter_inputs (v1.2). v1.1 ships the suite's
# structural shell — the adapter's evidence shape is what's contracted.

criteria:
  - id: exit_code
    type: exit_code
    assertion:
      expected_exit_code: 0
      scope: every-fixture

  - id: evidence_presence
    type: evidence_presence
    assertion:
      required:
        - http-status
        - exit-code
      scope: every-fixture
