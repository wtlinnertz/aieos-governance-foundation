suite: sign.attestation-suite
contract: sign.attestation
contract_version: "1.0.0"

# v1.1 input mapping. Adapter wraps (subject, predicate) in an in-toto statement
# and signs it via keyless OIDC (ambient) in CI.
inputs:
  subject_ref:
    value: "sha256:deadbeef"
  predicate_payload:
    value: {result: "pass"}
  predicate_type:
    value: "https://aieos.dev/attestations/conformance/v1"
  signing_identity_ref:
    value: "ambient"

# Same rationale as sign.artifact-suite: bundles are non-deterministic, so
# schema_conformance is the contract. sign.attestation-specific: the
# bundle must carry a dsseEnvelope (DSSE-wrapped in-toto Statement) rather
# than a messageSignature. The OCI signing bundle schema's oneOf enforces
# exactly one of dsseEnvelope or messageSignature; v1 sign.attestation
# adapters that produce messageSignature instead of DSSE pass schema
# validation but fail predicate_type_expected — that's a separate run
# validator concern, not a conformance issue.

criteria:
  - id: schema_conformance
    type: schema_conformance
    assertion:
      schema: findings/schemas/oci-signing-bundle.schema.json
      scope: every-fixture

  - id: exit_code
    type: exit_code
    assertion:
      expected_exit_code: 0
      scope: every-fixture

  - id: evidence_presence
    type: evidence_presence
    assertion:
      required:
        - sigstore-bundle
        - exit-code
      scope: every-fixture
