suite: test.integration-suite
contract: test.integration
contract_version: "1.0.0"

criteria:
  - id: schema_conformance
    type: schema_conformance
    description: Adapter output must validate against the canonical JUnit-JSON schema.
    assertion:
      schema: findings/schemas/junit-xml.schema.json
      scope: every-fixture

  - id: structural_match
    type: structural_match
    description: Adapter output must structurally match the expected JUnit findings for each fixture.
    assertion:
      expected_dir: expected/
      scope: every-fixture
    tolerances:
      - path: testsuite[*].testcase[*].time
        rule: any-non-negative-number
      - path: testsuite[*].time
        rule: any-non-negative-number
      - path: time
        rule: any-non-negative-number

  - id: exit_code
    type: exit_code
    description: Adapter exit code must be 0 on well-formed output.
    assertion:
      expected_exit_code: 0
      scope: every-fixture

  - id: evidence_presence
    type: evidence_presence
    description: Every evidence artifact in the contract's required_evidence must be emitted.
    assertion:
      required:
        - junit-report
        - exit-code
      scope: every-fixture
