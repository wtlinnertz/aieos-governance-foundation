action: verify.health
contract_version: "1.0.0"

required_inputs:
  type: object
  required:
    - target_url
    - health_endpoint_configuration
  properties:
    target_url:
      type: string
      format: uri
      description: URL of the deployed environment.
    health_endpoint_configuration:
      type: object
      description: Per-check configuration for health endpoints.
      properties:
        paths:
          type: array
          minItems: 1
          items:
            type: string
        expected_status_codes:
          type: array
          minItems: 1
          items:
            type: integer
        expected_response_shape:
          type: object

output_schema: null

required_evidence:
  - per-check-results
  - exit-code

conformance_suite: verify.health-suite
