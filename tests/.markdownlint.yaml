# markdownlint configuration for AIEOS framework
# See https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Disable line length — tables and ASCII diagrams exceed 80 chars
MD013: false

# Allow multiple top-level headings — some docs have multiple H1s
MD025: false

# Allow trailing punctuation in headings — specs use "?" and ":"
MD026:
  punctuation: ".,;!"

# Allow inline HTML — some templates use HTML comments
MD033: false

# Allow bare URLs — referenced in some docs
MD034: false

# Disable first-line heading requirement — YAML frontmatter or context lines may precede
MD041: false

# Allow duplicate headings — specs reuse section names across artifact types
MD024: false

# Allow emphasis as heading — some docs use bold text as pseudo-headings
MD036: false
