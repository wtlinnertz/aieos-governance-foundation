action: verify.slo
contract_version: "1.0.0"

required_inputs:
  type: object
  required:
    - target_env_ref
    - slo_definitions
    - measurement_window_seconds
  properties:
    target_env_ref:
      type: string
      description: Reference to the target environment whose SLOs are evaluated.
    slo_definitions:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - metric
          - threshold
          - window
        properties:
          metric:
            type: string
          threshold:
            type: number
          window:
            type: integer
            minimum: 1
      description: SLO definitions to evaluate — metric name, threshold, and window in seconds.
    measurement_window_seconds:
      type: integer
      minimum: 1
      description: Total measurement window (seconds) the adapter observes.

output_schema: null

required_evidence:
  - per-slo-measurements
  - exit-code

conformance_suite: verify.slo-suite
