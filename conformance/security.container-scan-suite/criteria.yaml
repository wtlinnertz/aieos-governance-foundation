suite: security.container-scan-suite
contract: security.container-scan
contract_version: "1.0.0"

criteria:
  - id: schema_conformance
    type: schema_conformance
    assertion:
      schema: findings/schemas/cyclonedx-1.6-findings.schema.json
      scope: every-fixture

  - id: exit_code
    type: exit_code
    assertion:
      expected_exit_code: 0
      scope: every-fixture

  - id: evidence_presence
    type: evidence_presence
    assertion:
      required:
        - cyclonedx-findings
        - exit-code
      scope: every-fixture
