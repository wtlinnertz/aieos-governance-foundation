action: security.secret-scan
contract_version: "1.0.0"

required_inputs:
  type: object
  required:
    - source_dir
  properties:
    source_dir:
      type: string
      description: Path to the source directory to scan for committed secrets.
    ruleset_ref:
      type: string
      description: Reference to the secret-detection ruleset.
    exclusion_patterns:
      type: array
      items:
        type: string
      description: Glob patterns to exclude from the scan.

output_schema: findings/schemas/sarif-2.1.0.schema.json

required_evidence:
  - sarif-report
  - exit-code

conformance_suite: security.secret-scan-suite
