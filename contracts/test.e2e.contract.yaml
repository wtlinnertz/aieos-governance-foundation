action: test.e2e
contract_version: "1.0.0"

required_inputs:
  type: object
  required:
    - target_url
  properties:
    target_url:
      type: string
      format: uri
      description: URL of the deployed environment to run end-to-end tests against.
    test_config_path:
      type: string
      description: Path to the test runner config file.
    credentials_ref:
      type: string
      description: Reference to credentials the test harness needs (e.g., secret manager key).

output_schema: findings/schemas/junit-xml.schema.json

required_evidence:
  - junit-report
  - exit-code

conformance_suite: test.e2e-suite
