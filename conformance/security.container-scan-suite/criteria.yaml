suite: security.container-scan-suite
contract: security.container-scan
contract_version: "1.0.0"

# v1.1 input mapping: security.container-scan requires image_ref. Scanners pull
# the image directly, so a pinned public known-vulnerable image works as the
# fixture (no build/registry step needed). See fixtures/image-ref.txt.
inputs:
  image_ref:
    value: "docker.io/library/alpine:3.4"

criteria:
  - id: schema_conformance
    type: schema_conformance
    assertion:
      schema: findings/schemas/cyclonedx-1.6-findings.schema.json
      scope: every-fixture

  - id: exit_code
    type: exit_code
    assertion:
      expected_exit_code: 0
      scope: every-fixture

  - id: evidence_presence
    type: evidence_presence
    assertion:
      required:
        - cyclonedx-findings
        - exit-code
      scope: every-fixture
